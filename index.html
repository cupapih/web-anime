<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>BStationX - Katalog Anime</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="storage.js"></script>
<style>
  :root { --primary: #ec4899; --bg: #0f0f0f; --card-bg: #18181b; }
  body { margin:0; background: var(--bg); color:#fff; font-family: 'Segoe UI', Arial, sans-serif; }
  .navbar { padding: 16px 24px; background: var(--card-bg); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
  .logo { color: var(--primary); font-size: 24px; font-weight: bold; }
  .filter-container { padding: 15px 24px; display: flex; gap: 10px; overflow-x: auto; white-space: nowrap; }
  .chip { padding: 6px 16px; background: #27272a; border-radius: 20px; font-size: 13px; cursor: pointer; }
  .chip.active { background: var(--primary); }
  .grid { padding: 24px; display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 20px; }
  .card { background: var(--card-bg); border-radius: 12px; overflow: hidden; transition: 0.3s; cursor: pointer; }
  .card:hover { transform: translateY(-5px); box-shadow: 0 5px 15px rgba(236,72,153,0.3); }
  .card img { width: 100%; height: 220px; object-fit: cover; }
  .info { padding: 12px; }
  .title { font-size: 14px; font-weight: bold; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .genre-label { font-size: 11px; color: var(--primary); margin-bottom: 4px; }
</style>
</head>
<body>

<div class="navbar">
  <div class="logo">BStationX</div>
  <div id="stats">0 Anime</div>
</div>

<div class="filter-container" id="filterList">
  <div class="chip active" data-genre="All">Semua</div>
</div>

<div class="grid" id="list">
  <div style="grid-column:1/-1;text-align:center;padding:50px">Loading...</div>
</div>

<script>
let allData = [];
let activeFilter = 'All';

async function loadData() {
  const list = document.getElementById('list');
  list.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:50px">Loading...</div>';
  
  try {
    allData = await getDB();
    
    if (!allData || allData.length === 0) {
      list.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:50px">Database kosong. Jalankan scraper!</div>';
      return;
    }
    
    document.getElementById('stats').innerText = `${allData.length} Anime`;
    
    // Load genres
    loadGenres();
    
    // Render
    renderList();
    
  } catch(e) {
    list.innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:50px;color:red">Error: ${e.message}</div>`;
  }
}

function loadGenres() {
  const genres = new Set();
  allData.forEach(anime => {
    if (anime.genres) {
      anime.genres.forEach(g => genres.add(g));
    }
  });
  
  const container = document.getElementById('filterList');
  // Hapus semua chip kecuali "Semua"
  container.innerHTML = '<div class="chip active" data-genre="All">Semua</div>';
  
  Array.from(genres).sort().forEach(genre => {
    const chip = document.createElement('div');
    chip.className = 'chip';
    chip.dataset.genre = genre;
    chip.innerText = genre;
    chip.onclick = () => filterGenre(genre, chip);
    container.appendChild(chip);
  });
}

function filterGenre(genre, element) {
  activeFilter = genre;
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  element.classList.add('active');
  renderList();
}

function renderList() {
  const list = document.getElementById('list');
  list.innerHTML = '';
  
  const filtered = activeFilter === 'All' 
    ? allData 
    : allData.filter(a => a.genres && a.genres.includes(activeFilter));
  
  filtered.forEach((anime, i) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.onclick = () => location.href = `player.html?slug=${anime.slug}&ep=1`;
    
    const imgSrc = anime.cover || 'https://via.placeholder.com/150x220?text=No+Image';
    const genreText = anime.genres ? anime.genres[0] : 'Anime';
    
    card.innerHTML = `
      <img src="${imgSrc}" alt="${anime.title}" onerror="this.src='https://via.placeholder.com/150x220?text=No+Image'">
      <div class="info">
        <div class="genre-label">${genreText}</div>
        <div class="title">${anime.title}</div>
      </div>
    `;
    
    list.appendChild(card);
  });
}

loadData();
</script>

</body>
</html>
